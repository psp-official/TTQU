<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My TikTok HQ Optimizer Studio</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #14161d;
      --accent: #25F4EE;
      --pink: #FE2C55;
      --text: #f0f2f5;
      --muted: #8b92a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid rgba(37, 244, 238, 0.18);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
    }
    p.sub {
      margin: 0 0 22px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #d0d5e0;
    }
    select, input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      background: #1c1f2a;
      border: 1px solid #2e3346;
      border-radius: 10px;
      color: #fff;
      font-size: 13.5px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, var(--accent), #1ad1cb);
      color: #08090c;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      color: var(--accent);
      min-height: 20px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 6px;
      background: rgba(254, 44, 85, 0.15);
      color: var(--pink);
      border: 1px solid rgba(254, 44, 85, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ TikTok HQ Optimizer <span class="badge">Self-Hosted</span></h1>
    <p class="sub">ကိုယ်ပိုင် Server မှတစ်ဆင့် ဗီဒီယိုအရည်အသွေး မကျစေရန်နှင့် Hash အသစ်ပြောင်းရန်</p>

    <form id="optForm">
      <div class="field">
        <label>ဗီဒီယိုဖိုင် ရွေးချယ်ရန် (.mp4, .mkv, .mov)</label>
        <input type="file" id="videoFile" accept="video/*" required>
      </div>

      <div class="field">
        <label>Processing Mode ရွေးချယ်ရန်</label>
        <select id="mode">
          <option value="fast">⚡ Fast Bypass (Lossless Stream Copy + Anti-Duplicate Hash)</option>
          <option value="hq">💎 Full HQ Re-Encode (1080p Lanczos + Unsharp + bt709 + 60fps)</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Frame Rate (FPS)</label>
          <select id="fps">
            <option value="60">60 FPS (Smooth)</option>
            <option value="30">30 FPS (Standard)</option>
          </select>
        </div>
        <div class="field">
          <label>Quality (CRF)</label>
          <select id="crf">
            <option value="18">CRF 18 (Ultra HQ)</option>
            <option value="20">CRF 20 (Balanced)</option>
            <option value="16">CRF 16 (Max Bitrate)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>API Key (သတ်မှတ်ထားပါက ထည့်ရန်)</label>
        <input type="password" id="apiKey" placeholder="Optional API Key">
      </div>

      <button type="submit" class="btn" id="submitBtn">🚀 Optimize & Download HQ Video</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('optForm');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('videoFile');
      if (!fileInput.files.length) return;

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('video', file);
      formData.append('mode', document.getElementById('mode').value);
      formData.append('fps', document.getElementById('fps').value);
      formData.append('crf', document.getElementById('crf').value);
      formData.append('api_key', document.getElementById('apiKey').value);

      btn.disabled = true;
      statusEl.textContent = '⏳ Server ပေါ်တွင် ဗီဒီယိုကို အရည်အသွေးမြှင့်တင်နေပါသည်... ခဏစောင့်ပါ...';

      try {
        const res = await fetch('/api/optimize', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Server error');
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.[^/.]+$/, '') + '_TikTok_HQ.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.textContent = '✅ အောင်မြင်ပါသည်! HQ ဗီဒီယိုကို ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ။';
      } catch (err) {
        statusEl.textContent = '❌ အမှားအယွင်းရှိပါသည်: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 310px;
      padding: 16px;
      background: #0f1117;
      color: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #25F4EE;
      font-size: 15px;
      border-bottom: 1px solid #262936;
      padding-bottom: 8px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11.5px;
      color: #9ba3b8;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 7px 9px;
      background: #1a1d27;
      border: 1px solid #2e3446;
      color: #fff;
      border-radius: 6px;
      font-size: 12.5px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      font-size: 12.5px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      background: #25F4EE;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    #saveMsg {
      font-size: 11px;
      color: #25F4EE;
      text-align: center;
      margin-top: 6px;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <h3>⚡ My TikTok HQ Server</h3>

  <div class="field">
    <label>Your Hosting Server URL (ဥပမာ https://my-app.onrender.com)</label>
    <input type="text" id="serverUrl" placeholder="https://your-domain.com">
  </div>

  <div class="field">
    <label>API Key (Optional)</label>
    <input type="password" id="apiKey" placeholder="Secret Key">
  </div>

  <div class="field">
    <label>Server Processing Mode</label>
    <select id="optMode">
      <option value="fast">⚡ Fast Remux (0 Compression + New Hash)</option>
      <option value="hq">💎 Full HQ Encode (1080p Lanczos + CRF 18)</option>
      <option value="off">🚫 Server မသုံးပါ (WebCodecs Bypass သာသုံးမည်)</option>
    </select>
  </div>

  <div class="field">
    <label>Privacy Lock (Post တင်ချိန်)</label>
    <select id="privacyMode">
      <option value="keep">UI တွင် ရွေးထားသည့်အတိုင်း ထားမည်</option>
      <option value="2">🔒 Only You (Private အမြဲထားမည်)</option>
      <option value="1">👥 Friends</option>
      <option value="0">🌍 Everyone (Public)</option>
    </select>
  </div>

  <div class="row">
    <span>Disable Browser Compression</span>
    <input type="checkbox" id="hqToggle" checked>
  </div>

  <button class="btn" id="saveBtn">Save Settings</button>
  <div id="saveMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
